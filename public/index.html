<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KRK WORD LIVE</title><style>body{font:16px system-ui;background:#111827;color:#f8fafc;margin:0;padding:24px}main{max-width:480px;margin:auto}input,button{box-sizing:border-box;width:100%;padding:15px;border:1px solid #475569;border-radius:12px;margin:6px 0;font:inherit}button{background:#e5bd72;color:#111827;font-weight:bold}section{background:#1e293b;padding:16px;border-radius:14px;margin:12px 0}small{color:#aab9cc}li{overflow-wrap:anywhere;margin:8px 0}h1{color:#e5bd72}</style></head><body><main><small>KRK STUDIO / BAĞLANTI TESTİ</small><h1>KRK WORD LIVE</h1><p>Bu ekran yayın için değil, gerçek olayları doğrulamak içindir.</p><input id="token" type="password" placeholder="Yönetici anahtarı"><button id="join">Bağlan</button><section>Durum: <strong id="status">Bekliyor</strong></section><section>Yorum: <b id="chats">0</b> · Hediye: <b id="gifts">0</b></section><section><h2>Canlı olaylar</h2><ol id="events"></ol></section></main><script src="/socket.io/socket.io.js"></script><script>let socket,c=0,g=0;const el=id=>document.getElementById(id);function log(value){const li=document.createElement('li');li.textContent=value;el('events').prepend(li);while(el('events').children.length>40)el('events').lastChild.remove()}el('join').onclick=()=>{socket?.disconnect();socket=io({auth:{token:el('token').value}});socket.on('status',d=>el('status').textContent=d.state);socket.on('connect_error',e=>el('status').textContent=e.message);socket.on('disconnect',()=>el('status').textContent='Sunucu bağlantısı koptu');socket.on('notice',log);socket.on('chat',d=>{el('chats').textContent=++c;log('@'+d.user+': '+d.comment)});socket.on('gift',d=>{g+=d.count;el('gifts').textContent=g;log('@'+d.user+' · '+d.name+' × '+d.count)});};</script></body></html>
