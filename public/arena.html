<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KRK WORD LIVE Arena</title><style>*{box-sizing:border-box}body{margin:0;background:#080e20;color:#fff;font:16px system-ui}main{width:min(100%,430px);margin:auto;min-height:100svh;padding:14px 22px 24px;background:radial-gradient(ellipse at top,#35446e,#111a32 60%);display:flex;flex-direction:column;gap:12px}header{text-align:center}h1{margin:4px;font-size:29px;color:#ffe0a0;letter-spacing:2px}small{color:#b4c2df}button,input{font:inherit;border:0;border-radius:10px;padding:10px}button{background:#e9c37d;color:#19213a;font-weight:bold;cursor:pointer}input{min-width:0;width:100%}section{background:#ffffff0c;border:1px solid #ffffff12;border-radius:14px;padding:12px}.stats{display:flex;justify-content:space-between;align-items:center}.timer{font-size:26px;color:#ffe0a0;font-weight:800}.words{display:grid;gap:7px;justify-content:center;min-height:140px;align-content:center}.word{display:flex;gap:5px;justify-content:center}.tile{width:29px;height:30px;display:grid;place-items:center;background:#3c4e76;border-radius:5px;font-weight:800}.found .tile{background:#e9c37d;color:#182039}.wheel{position:relative;width:170px;height:170px;margin:auto;border:2px solid #697da3;border-radius:50%;background:#0d172c}.letter{position:absolute;transform:translate(-50%,-50%);width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#fbe7bb;color:#152039;font-size:23px;font-weight:bold}.center{position:absolute;inset:0;display:grid;place-items:center;color:#8199c6;font-size:24px}.prompt{text-align:center;color:#a4edc0;font-weight:800}.boards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.boards section{min-width:0;font-size:12px}.boards b{color:#ffe0a0}.rank{display:flex;justify-content:space-between;gap:4px;margin-top:8px}.rank span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.notice{text-align:center;min-height:24px;color:#ffe0a0;font-size:13px}.controls{display:grid;gap:8px}.entry{display:flex;gap:6px}.hide .controls{display:none}.hide #exit{display:block}#exit{display:none}a{color:#b4c2df;font-size:12px}#progress{height:5px;background:#263452;border-radius:6px;overflow:hidden}#bar{height:100%;background:#e9c37d;transition:width .3s}</style></head><body><main id="screen"><header><small id="mode">● DEMO MODU</small><h1>KRK WORD</h1><small>L I V E  A R E N A</small></header><section><div class="stats"><div><b id="round">TUR 1</b><br><small id="count"></small></div><div class="timer" id="time">01:30</div></div><div id="progress"><div id="bar"></div></div></section><section class="words" id="words"></section><div class="wheel" id="wheel"></div><div class="prompt">KELİMENİ YORUMA YAZ!</div><div class="notice" id="notice">Harflerden kelime oluştur.</div><div class="boards"><section><b>🏆 KELİME LİDERLERİ</b><div id="leaders"></div></section><section><b>👑 DESTEKÇİLER</b><div id="support"></div></section></div><button id="exit">Kontrolleri göster</button><section class="controls"><div class="entry"><input id="guess" placeholder="Demo kelime yaz" autocomplete="off"><button id="send">Dene</button></div><div class="entry"><button id="demo">Demo oyuncu</button><button id="gift">Demo hediye</button></div><div class="entry"><input id="token" type="password" placeholder="Yönetici anahtarı"><button id="live">Canlı bağlan</button></div><button id="full">Yayın görünümü</button><a href="/">Bağlantı test paneli</a></section></main><script src="/socket.io/socket.io.js"></script><script>
const puzzles=[['KALEM',['KALEM','KALE','ELMA','ALEM','ELA','KEL','MAL']],['KARTON',['KARTON','KART','ORTA','KATRAN'].filter(w=>w!=='KATRAN').concat(['KAR','KAT','TON','NOT','TOK'])],['DENİZ',['DENİZ','DİZ','DİN','ZİNDE','İZ','İN']],['KİTAP',['KİTAP','KAT','PAT','TAK','TİP','İP']],['ORMAN',['ORMAN','ROMAN','ONAR','NAR','MOR','ROM']],['BALIK',['BALIK','BAK','BAL','KAL','KIL','AL']],['YAPRAK',['YAPRAK','YAP','YAK','KAR','KAP','PARA','KAYA']],['SALON',['SALON','SON','SAL','SOL','NAL','ON']]];
const $=id=>document.getElementById(id);let r=0,left=90,found=new Set(),scores=new Map(),gifts=new Map(),hint=null,ended=false,socket,live=false;const norm=s=>String(s).trim().toLocaleUpperCase('tr-TR');const p=()=>puzzles[r%puzzles.length];function node(tag,cls,t){const a=document.createElement(tag);a.className=cls;a.textContent=t;return a}function ranks(id,map){const box=$(id);box.replaceChildren();const rows=[...map].sort((a,b)=>b[1]-a[1]).slice(0,3);if(!rows.length)box.append(node('div','rank','Henüz yok'));for(const [u,v] of rows){const l=node('div','rank','');l.append(node('span','',u),node('strong','',v));box.append(l)}}function render(){$('round').textContent='TUR '+(r+1);$('count').textContent=found.size+'/'+p()[1].length+' kelime';$('time').textContent=Math.floor(left/60).toString().padStart(2,'0')+':'+(left%60).toString().padStart(2,'0');$('bar').style.width=(left/90*100)+'%';$('words').replaceChildren();for(const w of p()[1]){const row=node('div','word'+(found.has(w)?' found':''),'');[...w].forEach((ch,i)=>row.append(node('span','tile',found.has(w)||(hint===w&&i===0)?ch:'')));$('words').append(row)}ranks('leaders',scores);ranks('support',gifts)}function wheel(){$('wheel').replaceChildren(node('div','center','✦'));[...p()[0]].forEach((ch,i,a)=>{const l=node('span','letter',ch);l.style.left=(50+37*Math.sin(i*2*Math.PI/a.length))+'%';l.style.top=(50-37*Math.cos(i*2*Math.PI/a.length))+'%';$('wheel').append(l)})}function next(){r++;left=90;found=new Set();hint=null;ended=false;$('notice').textContent='Yeni tur başladı!';wheel();render()}function finish(){if(ended)return;ended=true;$('notice').textContent='Tur bitti! Cevaplar: '+p()[1].join(', ');setTimeout(next,5000)}function guess(u,s){if(ended)return;const w=norm(s);if(!p()[1].includes(w)||found.has(w))return;found.add(w);scores.set(u,(scores.get(u)||0)+w.length*10);$('notice').textContent=u+' · '+w+' +'+w.length*10;render();if(found.size===p()[1].length)finish()}function gift(u,count){gifts.set(u,(gifts.get(u)||0)+count);hint=p()[1].find(w=>!found.has(w));$('notice').textContent=u+' destek gönderdi!';render()}$('send').onclick=()=>{if(!live)guess('@sen',$('guess').value);$('guess').value=''};$('guess').onkeydown=e=>{if(e.key==='Enter')$('send').click()};$('demo').onclick=()=>{if(!live){const w=p()[1].find(w=>!found.has(w));if(w)guess(['@demo_ayse','@demo_mert','@demo_deniz'][Math.floor(Math.random()*3)],w)}};$('gift').onclick=()=>{if(!live)gift('@demo_destek',1)};$('full').onclick=()=>$('screen').classList.add('hide');$('exit').onclick=()=>$('screen').classList.remove('hide');$('live').onclick=()=>{socket?.disconnect();socket=io({auth:{token:$('token').value}});socket.on('status',d=>{if(d.state==='connected'&&!live){live=true;scores.clear();gifts.clear();next()}$('mode').textContent=live?'● CANLI · '+d.state:'● DEMO · '+d.state});socket.on('connect_error',()=>{$('notice').textContent='Yönetici bağlantısı başarısız'});socket.on('disconnect',()=>{$('mode').textContent='● BAĞLANTI KOPTU'});socket.on('chat',d=>{if(live)guess('@'+d.user,d.comment)});socket.on('gift',d=>{if(live)gift('@'+d.user,d.count)})};setInterval(()=>{if(!ended){left=Math.max(0,left-1);render();if(!left)finish()}},1000);wheel();render();
</script></body></html>
