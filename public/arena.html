<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KRK WORD LIVE Arena</title><style>*{box-sizing:border-box}body{margin:0;background:#080e20;color:#fff;font:16px system-ui}main{width:min(100%,430px);margin:auto;min-height:100svh;padding:14px 22px 24px;background:radial-gradient(ellipse at top,#35446e,#111a32 60%);display:flex;flex-direction:column;gap:12px}header{text-align:center}h1{margin:4px;font-size:29px;color:#ffe0a0;letter-spacing:2px}small{color:#b4c2df}button,input{font:inherit;border:0;border-radius:10px;padding:10px}button{background:#e9c37d;color:#19213a;font-weight:bold;cursor:pointer}input{min-width:0;width:100%}section{background:#ffffff0c;border:1px solid #ffffff12;border-radius:14px;padding:12px}.stats{display:flex;justify-content:space-between;align-items:center}.timer{font-size:26px;color:#ffe0a0;font-weight:800}.words{display:grid;gap:7px;justify-content:center;min-height:140px;align-content:center}.word{display:flex;gap:5px;justify-content:center}.tile{width:29px;height:30px;display:grid;place-items:center;background:#3c4e76;border-radius:5px;font-weight:800}.tile.revealed{background:#e9c37d;color:#182039}.wheel{position:relative;width:170px;height:170px;margin:auto;border:2px solid #697da3;border-radius:50%;background:#0d172c}.letter{position:absolute;transform:translate(-50%,-50%);width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#fbe7bb;color:#152039;font-size:23px;font-weight:bold}.center{position:absolute;inset:0;display:grid;place-items:center;color:#8199c6;font-size:24px}.prompt{text-align:center;color:#a4edc0;font-weight:800}.boards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.boards section{min-width:0;font-size:12px}.boards b{color:#ffe0a0}.rank{display:flex;justify-content:space-between;gap:4px;margin-top:8px}.rank span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.notice{text-align:center;min-height:24px;color:#ffe0a0;font-size:13px}.controls{display:grid;gap:8px}.entry{display:flex;gap:6px}.hide .controls{display:none}.hide #exit{display:block}#exit{display:none}a{color:#b4c2df;font-size:12px}#progress{height:5px;background:#263452;border-radius:6px;overflow:hidden}#bar{height:100%;background:#e9c37d;transition:width .3s}.words{gap:3px;justify-content:center;align-content:center;min-height:190px}.words .tile{width:var(--tile);height:var(--tile);font-size:clamp(11px,4vw,19px)}</style></head><body><main id="screen"><header><small id="mode">● DEMO MODU</small><h1>KRK WORD</h1><small>L I V E  A R E N A</small></header><section><div class="stats"><div><b id="round">TUR 1</b><br><small id="count"></small></div><div class="timer" id="time">01:30</div></div><div id="progress"><div id="bar"></div></div></section><section class="words" id="words"></section><div class="wheel" id="wheel"></div><div class="prompt">KELİMENİ YORUMA YAZ!</div><div class="notice" id="notice">Harflerden kelime oluştur.</div><div class="boards"><section><b>🏆 KELİME LİDERLERİ</b><div id="leaders"></div></section><section><b>👑 DESTEKÇİLER</b><div id="support"></div></section></div><button id="exit">Kontrolleri göster</button><section class="controls"><div class="entry"><input id="guess" placeholder="Demo kelime yaz" autocomplete="off"><button id="send">Dene</button></div><div class="entry"><button id="demo">Demo oyuncu</button><button id="gift">Demo hediye</button></div><div class="entry"><input id="token" type="password" placeholder="Yönetici anahtarı"><button id="live">Canlı bağlan</button></div><button id="full">Yayın görünümü</button><a href="/">Bağlantı test paneli</a></section></main><script src="/socket.io/socket.io.js"></script><script>
const puzzles=[["KALEM",["KALEM","ELA","ELMA","KEL","MAL","KALE","ALEM"],[{"w":"KALEM","x":0,"y":0,"d":0},{"w":"ELA","x":1,"y":-2,"d":1},{"w":"ELMA","x":1,"y":-2,"d":0},{"w":"KEL","x":0,"y":0,"d":1},{"w":"MAL","x":4,"y":0,"d":1},{"w":"KALE","x":2,"y":2,"d":0},{"w":"ALEM","x":3,"y":-5,"d":1}],[]],["KARTON",["KARTON","KAR","TON","NOT","KART","TOK","KAT","ORTA"],[{"w":"KARTON","x":0,"y":0,"d":0},{"w":"KAR","x":0,"y":0,"d":1},{"w":"TON","x":3,"y":0,"d":1},{"w":"NOT","x":5,"y":0,"d":1},{"w":"KART","x":-2,"y":2,"d":0},{"w":"TOK","x":-2,"y":0,"d":1},{"w":"KAT","x":-4,"y":0,"d":0},{"w":"ORTA","x":1,"y":-3,"d":1}],[]],["DENİZ",["DENİZ","İZ","DİZ","İN"],[{"w":"DENİZ","x":0,"y":0,"d":0},{"w":"İZ","x":3,"y":0,"d":1},{"w":"DİZ","x":0,"y":0,"d":1},{"w":"İN","x":2,"y":-1,"d":1}],["DİN","ZİNDE"]],["KİTAP",["KİTAP","İP","KAT","TAK","TİP"],[{"w":"KİTAP","x":0,"y":0,"d":0},{"w":"İP","x":1,"y":0,"d":1},{"w":"KAT","x":3,"y":-1,"d":1},{"w":"TAK","x":0,"y":-2,"d":1},{"w":"TİP","x":0,"y":-2,"d":0}],["PAT"]],["ORMAN",["ORMAN","NAR","ONAR","MOR","ROM"],[{"w":"ORMAN","x":0,"y":0,"d":0},{"w":"NAR","x":1,"y":-2,"d":1},{"w":"ONAR","x":0,"y":-2,"d":0},{"w":"MOR","x":2,"y":0,"d":1},{"w":"ROM","x":2,"y":2,"d":0}],["ROMAN"]],["BALIK",["BALIK","AL","KAL","BAL","BAK","KIL"],[{"w":"BALIK","x":0,"y":0,"d":0},{"w":"AL","x":1,"y":0,"d":1},{"w":"KAL","x":4,"y":0,"d":1},{"w":"BAL","x":2,"y":2,"d":0},{"w":"BAK","x":2,"y":2,"d":1},{"w":"KIL","x":2,"y":4,"d":0}],[]],["YAPRAK",["YAPRAK","YAP","PARA","KAR","KAYA","YAK","KAP"],[{"w":"YAPRAK","x":0,"y":0,"d":0},{"w":"YAP","x":0,"y":0,"d":1},{"w":"PARA","x":0,"y":2,"d":0},{"w":"KAR","x":5,"y":0,"d":1},{"w":"KAYA","x":-3,"y":1,"d":0},{"w":"YAK","x":-2,"y":0,"d":1},{"w":"KAP","x":2,"y":-2,"d":1}],[]],["SALON",["SALON","ON","SON","NAL","SAL","SOL"],[{"w":"SALON","x":0,"y":0,"d":0},{"w":"ON","x":3,"y":0,"d":1},{"w":"SON","x":0,"y":0,"d":1},{"w":"NAL","x":0,"y":2,"d":0},{"w":"SAL","x":2,"y":-2,"d":1},{"w":"SOL","x":2,"y":-2,"d":0}],[]]];
const $=id=>document.getElementById(id);let r=0,left=90,found=new Set(),scores=new Map(),gifts=new Map(),hint=new Set(),ended=false,socket,live=false;const norm=s=>String(s).trim().toLocaleUpperCase('tr-TR');const p=()=>puzzles[r%puzzles.length];let bonus=new Set();const cells=w=>{const a=p()[2].find(t=>t.w===w);return a?[...w].map((ch,i)=>[a.x+i*(1-a.d),a.y+i*a.d,ch]):[]};const cellKey=(x,y)=>x+','+y;function node(tag,cls,t){const a=document.createElement(tag);a.className=cls;a.textContent=t;return a}function ranks(id,map){const box=$(id);box.replaceChildren();const rows=[...map].sort((a,b)=>b[1]-a[1]).slice(0,3);if(!rows.length)box.append(node('div','rank','Henüz yok'));for(const [u,v] of rows){const l=node('div','rank','');l.append(node('span','',u),node('strong','',v));box.append(l)}}function render(){$('round').textContent='TUR '+(r+1);$('count').textContent=found.size+'/'+p()[1].length+' kelime';$('time').textContent=Math.floor(left/60).toString().padStart(2,'0')+':'+(left%60).toString().padStart(2,'0');$('bar').style.width=(left/90*100)+'%';const all=p()[2].flatMap(a=>cells(a.w)),xs=all.map(a=>a[0]),ys=all.map(a=>a[1]),minX=Math.min(...xs),minY=Math.min(...ys),W=Math.max(...xs)-minX+1,H=Math.max(...ys)-minY+1;const revealed=new Set([...found].flatMap(w=>cells(w).map(a=>cellKey(a[0],a[1]))));const grid=$('words');grid.replaceChildren();grid.style.gridTemplateColumns='repeat('+W+',var(--tile))';grid.style.gridTemplateRows='repeat('+H+',var(--tile))';grid.style.setProperty('--tile','min(32px, calc((100vw - 90px) / '+W+'), '+Math.floor(245/H)+'px)');const used=new Set();for(const [x,y,ch] of all){const k=cellKey(x,y);if(used.has(k))continue;used.add(k);const visible=revealed.has(k)||hint.has(k)||ended;const t=node('span','tile'+(visible?' revealed':''),visible?ch:'');t.style.gridColumn=x-minX+1;t.style.gridRow=y-minY+1;grid.append(t)}ranks('leaders',scores);ranks('support',gifts)}function wheel(){$('wheel').replaceChildren(node('div','center','✦'));[...p()[0]].forEach((ch,i,a)=>{const l=node('span','letter',ch);l.style.left=(50+37*Math.sin(i*2*Math.PI/a.length))+'%';l.style.top=(50-37*Math.cos(i*2*Math.PI/a.length))+'%';$('wheel').append(l)})}function next(){r++;left=90;found=new Set();bonus=new Set();hint=new Set();ended=false;$('notice').textContent='Yeni tur başladı!';wheel();render()}function finish(){if(ended)return;ended=true;$('notice').textContent='Tur bitti! Cevaplar: '+p()[1].join(', ');render();const oldRound=r;setTimeout(()=>{if(r===oldRound)next()},5000)}function guess(u,s){if(ended)return;const w=norm(s);if(p()[3].includes(w)&&!bonus.has(w)){bonus.add(w);scores.set(u,(scores.get(u)||0)+5);$('notice').textContent=u+' · BONUS '+w+' +5';render();return;}if(!p()[1].includes(w)||found.has(w))return;found.add(w);scores.set(u,(scores.get(u)||0)+w.length*10);$('notice').textContent=u+' · '+w+' +'+w.length*10;render();if(found.size===p()[1].length)finish()}function gift(u,count){gifts.set(u,(gifts.get(u)||0)+count);const open=new Set([...found].flatMap(w=>cells(w).map(a=>cellKey(a[0],a[1]))));for(let i=0;i<Math.min(count,100);i++){const cell=p()[2].flatMap(a=>cells(a.w)).find(a=>!open.has(cellKey(a[0],a[1]))&&!hint.has(cellKey(a[0],a[1])));if(!cell)break;hint.add(cellKey(cell[0],cell[1]));}$('notice').textContent=u+' destek gönderdi!';render()}$('send').onclick=()=>{if(!live)guess('@sen',$('guess').value);$('guess').value=''};$('guess').onkeydown=e=>{if(e.key==='Enter')$('send').click()};$('demo').onclick=()=>{if(!live){const w=p()[1].find(w=>!found.has(w));if(w)guess(['@demo_ayse','@demo_mert','@demo_deniz'][Math.floor(Math.random()*3)],w)}};$('gift').onclick=()=>{if(!live)gift('@demo_destek',1)};$('full').onclick=()=>$('screen').classList.add('hide');$('exit').onclick=()=>$('screen').classList.remove('hide');$('live').onclick=()=>{socket?.disconnect();socket=io({auth:{token:$('token').value}});socket.on('status',d=>{if(d.state==='connected'&&!live){live=true;scores.clear();gifts.clear();next()}$('mode').textContent=live?'● CANLI · '+d.state:'● DEMO · '+d.state});socket.on('connect_error',()=>{$('notice').textContent='Yönetici bağlantısı başarısız'});socket.on('disconnect',()=>{$('mode').textContent='● BAĞLANTI KOPTU'});socket.on('chat',d=>{if(live)guess('@'+d.user,d.comment)});socket.on('gift',d=>{if(live)gift('@'+d.user,d.count)})};setInterval(()=>{if(!ended){left=Math.max(0,left-1);render();if(!left)finish()}},1000);wheel();render();
</script></body></html>
